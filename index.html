<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Certificate</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
  padding:30px;
}

/* BOX */
.box{
  max-width:900px;
  margin:auto;
  background:white;
  color:black;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* PDF */
iframe{
  width:100%;
  height:500px;
  border:none;
  margin-top:15px;
}

/* QR */
.qr{
  margin-top:20px;
}

.qr img{
  width:140px;
}

/* BUTTON */
a{
  display:inline-block;
  margin-top:10px;
  padding:10px 15px;
  background:#b8860b;
  color:white;
  text-decoration:none;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="box">

<h2 id="title">Loading...</h2>

<iframe id="pdf"></iframe>

<a id="download" target="_blank">Open Certificate PDF</a>

<div class="qr">
  <h4>Certificate QR</h4>
  <img id="qrImg">
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const code = params.get("code")?.toUpperCase();

let data = {};

fetch("certificates.csv")
.then(r => r.text())
.then(csv => {

  let parsed = Papa.parse(csv, { header:true });

  parsed.data.forEach(row=>{
    if(row.code){
      data[row.code.toUpperCase()] = row;
    }
  });

  let cert = data[code];

  if(cert){

    // title
    document.getElementById("title").innerText = cert.name;

    // PDF
    document.getElementById("pdf").src = cert.file;

    // download link
    document.getElementById("download").href = cert.file;

    // QR
    let url = window.location.href;

    document.getElementById("qrImg").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=" + encodeURIComponent(url);

  } else {
    document.body.innerHTML = "<h2>Certificate Not Found</h2>";
  }

});

</script>

</body>
</html>
