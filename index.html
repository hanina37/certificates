<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>International Academy for Protocol Leadership</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
}

/* HEADER */
.header{
  text-align:center;
  padding:30px;
}

.title{
  font-family:'Cinzel', serif;
  font-size:34px;
  background:linear-gradient(90deg,gold,#fff,gold);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* HERO IMAGE */
.hero{
  width:100%;
  height:420px;
  object-fit:cover;
}

/* NAV */
.nav{
  text-align:center;
  margin:15px;
}

.nav a{
  color:gold;
  margin:10px;
  text-decoration:none;
}

/* SEARCH BOX */
.card{
  background:white;
  color:black;
  max-width:500px;
  margin:-60px auto 40px;
  padding:25px;
  border-radius:15px;
  text-align:center;
}

input{
  width:90%;
  padding:12px;
  text-align:center;
}

button{
  margin-top:10px;
  padding:12px 18px;
  background:#b8860b;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.result{
  margin-top:20px;
}

.qr{
  width:120px;
  margin-top:10px;
}

</style>
</head>

<body>

<div class="header">
  <div class="title">International Academy for Protocol Leadership</div>
</div>

<!-- 🖼️ HERO IMAGE -->
<img src="images/hero.jpg" class="hero">

<!-- NAV -->
<div class="nav">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
</div>

<!-- SEARCH -->
<div class="card">

<h3>Certificate Verification</h3>

<input type="text" id="code" placeholder="Enter Certificate ID">
<br>
<button onclick="search()">Verify</button>

<div class="result" id="result"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

let data = {};

fetch("certificates.csv")
.then(r=>r.text())
.then(csv=>{
  let parsed = Papa.parse(csv,{header:true});
  parsed.data.forEach(row=>{
    if(row.code){
      data[row.code.toUpperCase()] = row;
    }
  });
});

function search(){

  let code = document.getElementById("code").value.toUpperCase();
  let r = document.getElementById("result");

  if(data[code]){

    let qr = `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${window.location.origin}/certificate.html?code=${code}`;

    r.innerHTML = `
      <h3>${data[code].name}</h3>
      <a href="certificate.html?code=${code}" target="_blank">View Certificate</a>
      <br>
      <img class="qr" src="${qr}">
    `;

  } else {
    r.innerHTML = "<p style='color:red'>Not Found</p>";
  }
}

</script>

</body>
</html>
