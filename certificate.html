<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Certificate Verification</title>

<style>

body{
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
  padding:30px;
}

/* BOX */
.box{
  max-width:900px;
  margin:auto;
  background:white;
  color:black;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* PDF VIEW */
iframe{
  width:100%;
  height:500px;
  border:none;
  margin-top:15px;
}

/* BUTTONS */
.buttons{
  margin-top:15px;
}

.btn{
  display:inline-block;
  margin:8px;
  padding:12px 18px;
  border-radius:8px;
  text-decoration:none;
  color:white;
  font-weight:bold;
}

.view{
  background:#b8860b;
}

.download{
  background:#444;
}

/* QR */
.qr{
  margin-top:20px;
}

.qr img{
  width:140px;
}

/* ERROR */
.error{
  color:red;
  font-size:18px;
}

</style>
</head>

<body>

<div class="box">

<h2 id="title">Loading Certificate...</h2>

<!-- PDF -->
<iframe id="pdf"></iframe>

<!-- BUTTONS -->
<div class="buttons">
  <a id="viewBtn" class="btn view" target="_blank">View Certificate</a>
  <a id="downloadBtn" class="btn download" target="_blank">Download PDF</a>
</div>

<!-- QR -->
<div class="qr">
  <h4>Certificate QR</h4>
  <img id="qrImg">
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const code = params.get("code")?.toUpperCase();

let data = {};

fetch("certificates.csv")
.then(r => r.text())
.then(csv => {

  let parsed = Papa.parse(csv, { header:true });

  parsed.data.forEach(row=>{
    if(row.code){
      data[row.code.toUpperCase()] = row;
    }
  });

  let cert = data[code];

  if(cert){

    // TITLE
    document.getElementById("title").innerText = cert.name;

    // PDF VIEW INSIDE PAGE
    document.getElementById("pdf").src = cert.file;

    // BUTTONS
    document.getElementById("viewBtn").href = cert.file;
    document.getElementById("downloadBtn").href = cert.file;

    // QR LINK (this page itself)
    let url = window.location.href;

    document.getElementById("qrImg").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=" + encodeURIComponent(url);

  } else {
    document.body.innerHTML = "<h2 class='error'>Certificate Not Found</h2>";
  }

});

</script>

</body>
</html>
