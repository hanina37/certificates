<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Certificate</title>

<style>

body{
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
  padding:30px;
}

.box{
  max-width:900px;
  margin:auto;
  background:white;
  color:black;
  padding:25px;
  border-radius:15px;
}

/* PDF */
iframe{
  width:100%;
  height:500px;
  border:none;
}

/* BUTTONS */
.btn{
  display:inline-block;
  margin:10px;
  padding:12px 18px;
  border-radius:8px;
  text-decoration:none;
  color:white;
}

.view{background:#b8860b;}
.download{background:#444;}
.back{background:#999;}

.qr img{
  width:140px;
  margin-top:10px;
}

</style>
</head>

<body>

<div class="box">

<h2 id="title">Loading...</h2>

<iframe id="pdf"></iframe>

<div>
  <a id="viewBtn" class="btn view" target="_blank">View</a>
  <a id="downloadBtn" class="btn download">Download</a>
  <a class="btn back" href="search.html">Back</a>
</div>

<div class="qr">
  <h4>QR Code</h4>
  <img id="qrImg">
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

const code = new URLSearchParams(window.location.search).get("code")?.toUpperCase();

let data = {};

fetch("certificates.csv")
.then(r=>r.text())
.then(csv=>{
  let parsed = Papa.parse(csv,{header:true});
  parsed.data.forEach(row=>{
    if(row.code){
      data[row.code.toUpperCase()] = row;
    }
  });

  let cert = data[code];

  if(cert){

    document.getElementById("title").innerText = cert.name;
    document.getElementById("pdf").src = cert.file;

    document.getElementById("viewBtn").href = cert.file;
    document.getElementById("downloadBtn").href = cert.file;

    let url = window.location.href;

    document.getElementById("qrImg").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=" + encodeURIComponent(url);

  } else {
    document.body.innerHTML = "<h2>Certificate Not Found</h2>";
  }

});

</script>

</body>
</html>
