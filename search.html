<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Search Certificates</title>

<style>

body{
  margin:0;
  font-family: Arial;
  background:url('images/bg.jpg');
  background-size:cover;
  color:white;
  text-align:center;
}

.card{
  background:white;
  color:black;
  max-width:500px;
  margin:100px auto;
  padding:25px;
  border-radius:15px;
}

input{
  width:90%;
  padding:12px;
  text-align:center;
}

button{
  margin-top:10px;
  padding:12px 18px;
  background:#b8860b;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="card">

<h2>Certificate Search</h2>

<input type="text" id="code" placeholder="Enter Certificate ID">
<br>
<button onclick="go()">Search</button>

</div>

<script>

function go(){
  let code = document.getElementById("code").value.toUpperCase();
  window.location.href = "certificate.html?code=" + code;
}

</script>

</body>
</html>
