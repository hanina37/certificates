<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Search Certificates</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:url('images/bg.jpg') no-repeat center center fixed;
  background-size:cover;
  color:white;
  text-align:center;
}

.overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  top:0;
  left:0;
  z-index:-1;
}

.card{
  background:white;
  color:black;
  max-width:500px;
  margin:120px auto;
  padding:25px;
  border-radius:15px;
}

input{
  width:90%;
  padding:12px;
  text-align:center;
}

button{
  margin-top:10px;
  padding:12px 18px;
  background:#b8860b;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.error{
  color:red;
  margin-top:15px;
}

.back{
  display:inline-block;
  margin-top:15px;
  padding:10px 15px;
  background:#777;
  color:white;
  text-decoration:none;
  border-radius:8px;
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="card">

<h2>Certificate Search</h2>

<input type="text" id="code" placeholder="Enter Certificate ID">

<br>

<button onclick="search()">Search</button>

<div id="error" class="error"></div>

<br>

<a href="index.html" class="back">Back to Home</a>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

let data = {};

fetch("certificates.csv")
.then(r=>r.text())
.then(csv=>{

  let parsed = Papa.parse(csv,{header:true});

  parsed.data.forEach(row=>{

    if(row.code){
      data[row.code.toUpperCase()] = row;
    }

  });

});

function search(){

  let code = document.getElementById("code").value.trim().toUpperCase();

  let error = document.getElementById("error");

  error.innerHTML = "";

  if(!data[code]){

    error.innerHTML = "No certificate found with this code.";

    return;
  }

  // انتقال لصفحة الشهادة
  window.location.href = "certificate.html?code=" + code;

}

</script>

</body>
</html>
